name: Desktop Cross-Platform Proof

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [feature/windows-desktop-alpha-v1, feature/tci-multirx-waterfall-globe-v1, feature/desktop-flightline-ui-convergence-v1, feature/desktop-ui-ux-deep-convergence-v2, feature/desktop-functional-parity-closure-v1, feature/hamlib-cloud-agent-v1]
    paths:
      - 'desktop/**'
      - 'core/**'
      - '.github/workflows/desktop-cross-platform.yml'

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.2'
          host: mac
          target: desktop
          arch: clang_64
          modules: 'qtmultimedia qtserialport qtwebsockets qtlocation qtpositioning'
          cache: true
      - name: Install the native Rust target
        run: rustup target add aarch64-apple-darwin
      - name: Configure same desktop source
        run: cmake -S desktop -B build/macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DSHACKCQ_BUILD_TESTS=ON
      - name: Build and test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --build build/macos --parallel 2
          ctest --test-dir build/macos --output-on-failure
      - name: Deterministic UI lifecycle stress
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p artifacts
          build/macos/ShackCQDesktop.app/Contents/MacOS/ShackCQDesktop --ui-stress-report artifacts/ui-stress-macos.json
      - name: Unsigned app packaging proof
        run: |
          cmake --install build/macos --prefix artifacts/macos
          macdeployqt artifacts/macos/ShackCQDesktop.app -qmldir=desktop/qml
          rm -f artifacts/macos/ShackCQDesktop.app/Contents/PlugIns/sqldrivers/libqsqlodbc.dylib \
                artifacts/macos/ShackCQDesktop.app/Contents/PlugIns/sqldrivers/libqsqlpsql.dylib \
                artifacts/macos/ShackCQDesktop.app/Contents/PlugIns/sqldrivers/libqsqlmimer.dylib
          ditto -c -k --sequesterRsrc artifacts/macos/ShackCQDesktop.app "artifacts/macos/ShackCQ-macOS-arm64-unsigned-v0.1.0-rc.1.zip"
          test "$(stat -f%z artifacts/macos/ShackCQ-macOS-arm64-unsigned-v0.1.0-rc.1.zip)" -le 209715200
          shasum -a 256 "artifacts/macos/ShackCQ-macOS-arm64-unsigned-v0.1.0-rc.1.zip" > artifacts/macos/SHA256SUMS.txt
      - name: Unsigned standalone ShackCQ Agent packaging proof
        run: |
          mkdir -p artifacts/macos/ShackCQAgent.app/Contents/MacOS
          cp build/macos/ShackCQAgent artifacts/macos/ShackCQAgent.app/Contents/MacOS/
          cp desktop/packaging/macos/agent-Info.plist artifacts/macos/ShackCQAgent.app/Contents/Info.plist
          agent_deploy_log="$(mktemp)"
          macdeployqt artifacts/macos/ShackCQAgent.app -no-plugins 2>&1 | tee "$agent_deploy_log"
          ! grep -q 'ERROR:' "$agent_deploy_log"
          test ! -d artifacts/macos/ShackCQAgent.app/Contents/PlugIns
          mkdir -p artifacts/macos/ShackCQAgent.app/Contents/Resources
          cp COPYING NOTICE artifacts/macos/ShackCQAgent.app/Contents/Resources/
          ! find artifacts/macos/ShackCQAgent.app -type f | grep -Ei '(private|identity|\.pem$|rigctld)'
          ditto -c -k --sequesterRsrc artifacts/macos/ShackCQAgent.app "artifacts/macos/ShackCQAgent-macOS-arm64-unsigned-${GITHUB_SHA}.zip"
          shasum -a 256 "artifacts/macos/ShackCQAgent-macOS-arm64-unsigned-${GITHUB_SHA}.zip" >> artifacts/macos/SHA256SUMS.txt
      - name: Deterministic macOS UI gallery
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          build/macos/ShackCQDesktop.app/Contents/MacOS/ShackCQDesktop --gallery-dir artifacts/ui-gallery/1920x1080 --gallery-width 1920 --gallery-height 1080
          build/macos/ShackCQDesktop.app/Contents/MacOS/ShackCQDesktop --gallery-dir artifacts/ui-gallery/1440x900 --gallery-width 1440 --gallery-height 900
          build/macos/ShackCQDesktop.app/Contents/MacOS/ShackCQDesktop --gallery-dir artifacts/ui-gallery/1512x982 --gallery-width 1512 --gallery-height 982
          build/macos/ShackCQDesktop.app/Contents/MacOS/ShackCQDesktop --gallery-dir artifacts/ui-gallery/2560x1440 --gallery-width 2560 --gallery-height 1440
          QT_SCALE_FACTOR=1.5 build/macos/ShackCQDesktop.app/Contents/MacOS/ShackCQDesktop --gallery-dir artifacts/ui-gallery/150pct --gallery-width 1280 --gallery-height 720
          for profile in 1440x900 1512x982 1920x1080 2560x1440 150pct; do
            test "$(find "artifacts/ui-gallery/$profile" -name '*.png' | wc -l | tr -d ' ')" = 58
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShackCQ-macOS-unsigned-${{ github.sha }}
          path: |
            artifacts/macos
            artifacts/ui-gallery
            artifacts/ui-stress-macos.json
          if-no-files-found: error
          retention-days: 14
