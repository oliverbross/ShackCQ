name: Release Candidate Gates

on:
  workflow_call:
    inputs:
      allow_descendant_validation:
        description: Validate an exact descendant branch while retaining RC1 ancestry and immutable-ref checks
        required: false
        default: false
        type: boolean
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feature/shackcq-final-convergence-v1, integration/shackcq-v0.1.0-rc1-final]

permissions:
  contents: read

jobs:
  contract-audit:
    runs-on: ubuntu-latest
    env:
      SHACKCQ_ALLOW_RC1_DESCENDANT_VALIDATION: ${{ (inputs.allow_descendant_validation || github.ref_name == 'feature/nexus-native-logbook-authority-v1' || github.ref_name == 'integration/shackcq-v0.1.0-rc1-final' || github.ref_name == 'main') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch declared lineage refs
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - run: python3 scripts/check_rc1_convergence.py
      - run: python3 scripts/check_hamlib_upstream.py
      - run: python3 -m unittest scripts/test_check_openhamclock_upstream.py
      - run: test -s NOTICE && test -s core/third_party/iturhfprop/SOURCE_MANIFEST.json

  rust-native:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - run: cargo test --manifest-path rust/shackcq-flex/Cargo.toml --locked
      - run: cargo test --manifest-path third_party/mfsk-core/Cargo.toml --locked --lib --all-features
      - run: cargo test --manifest-path rust/tempo-sstv/Cargo.toml --locked --lib
      - run: cmake -S core -B build/core && cmake --build build/core && ctest --test-dir build/core --output-on-failure
      - name: Native lifecycle ASan
        run: >-
          cmake -S core -B build/core-asan -DCMAKE_BUILD_TYPE=Debug
          -DSHACKCQ_ENABLE_ASAN=ON
          && cmake --build build/core-asan
          && ctest --test-dir build/core-asan --output-on-failure
      - name: Native lifecycle UBSan
        run: >-
          cmake -S core -B build/core-ubsan -DCMAKE_BUILD_TYPE=Debug
          -DSHACKCQ_ENABLE_UBSAN=ON
          && cmake --build build/core-ubsan
          && ctest --test-dir build/core-ubsan --output-on-failure

  android:
    runs-on: ubuntu-latest
    env:
      SHACKCQ_BUILD_CHANNEL: RC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Android tests, packages and instrumentation-source compile
        run: >-
          cd android && ./gradlew testDebugUnitTest assembleDebug bundleDebug
          compileDebugAndroidTestSources --no-daemon --max-workers=2
      - name: Android lint in an isolated bounded worker
        run: cd android && ./gradlew lintDebug --no-daemon --max-workers=1
      - run: python3 scripts/audit_android_package_size.py android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/bundle/debug/app-debug.aab
      - name: Verify four-ABI AAB size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          path = Path("android/app/build/outputs/bundle/debug/app-debug.aab")
          assert path.stat().st_size <= 60_000_000, path.stat().st_size
          with zipfile.ZipFile(path) as bundle:
              abis = {name.split("/")[2] for name in bundle.namelist() if name.startswith("base/lib/") and len(name.split("/")) > 3}
          assert abis == {"armeabi-v7a", "arm64-v8a", "x86", "x86_64"}, abis
          PY
      - run: cd android && ./gradlew :app:assembleDebug -PshackcqAbi=arm64-v8a --no-daemon --max-workers=2
      - name: Verify arm64 tablet APK
        run: |
          python3 scripts/audit_android_package_size.py android/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          path = Path("android/app/build/outputs/apk/debug/app-debug.apk")
          assert path.stat().st_size <= 130_000_000, path.stat().st_size
          with zipfile.ZipFile(path) as apk:
              abis = {name.split("/")[1] for name in apk.namelist() if name.startswith("lib/") and len(name.split("/")) > 2}
          assert abis == {"arm64-v8a"}, abis
          PY
      - name: Stage exact-SHA Android packages
        run: |
          mkdir -p build/rc1/android
          cp android/app/build/outputs/apk/debug/app-debug.apk "build/rc1/android/ShackCQ-Android-arm64-v0.1.0-rc.1.apk"
          cp android/app/build/outputs/bundle/debug/app-debug.aab "build/rc1/android/ShackCQ-Android-four-ABI-v0.1.0-rc.1.aab"
          sha256sum build/rc1/android/* > build/rc1/android/SHA256SUMS.txt
      - name: Upload exact-SHA Android packages
        uses: actions/upload-artifact@v4
        with:
          name: ShackCQ-Android-${{ github.sha }}
          path: build/rc1/android
          if-no-files-found: error

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run Apple fast-entry golden tests
        run: swiftc ios/ShackCQ/FastEntry.swift ios/Tests/FastEntryGoldenTests.swift -o /tmp/shackcq-fast-entry-tests && /tmp/shackcq-fast-entry-tests
      - name: Build iPhone/iPad simulator app
        run: xcodebuild -project ios/ShackCQ.xcodeproj -scheme ShackCQ -destination 'generic/platform=iOS Simulator' -derivedDataPath build/apple/simulator -skipUnavailableActions CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Build unsigned iPhone/iPad XCArchive
        run: xcodebuild -project ios/ShackCQ.xcodeproj -scheme ShackCQ -destination 'generic/platform=iOS' -archivePath build/apple/ShackCQ.xcarchive -skipUnavailableActions CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Package explicit unsigned Apple outputs
        run: |
          mkdir -p build/rc1/apple
          ditto -c -k --sequesterRsrc build/apple/simulator/Build/Products/Debug-iphonesimulator/ShackCQ.app build/rc1/apple/ShackCQ-iOS-Simulator-v0.1.0-rc.1.zip
          ditto -c -k --sequesterRsrc build/apple/ShackCQ.xcarchive build/rc1/apple/ShackCQ-iOS-unsigned-XCArchive-v0.1.0-rc.1.zip
          ! find build/rc1/apple -type f | grep -Ei '(mobileprovision|\.p12$|private|identity)'
          shasum -a 256 build/rc1/apple/*.zip > build/rc1/apple/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShackCQ-Apple-${{ github.sha }}
          path: build/rc1/apple
          if-no-files-found: error

  migration-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: >-
            cd android && ./gradlew connectedDebugAndroidTest --no-daemon
            -Pandroid.testInstrumentationRunnerArguments.class=app.shackcq.mobile.QsoDatabaseInstrumentedTest,app.shackcq.mobile.NeuralDxStoreInstrumentedTest,app.shackcq.mobile.NexusDigiSessionStoreInstrumentedTest,app.shackcq.mobile.groupsio.GroupsIoDatabaseInstrumentedTest,app.shackcq.mobile.ConfigurationRecoveryInstrumentedTest,app.shackcq.mobile.RemoteStationInstrumentedTest

  scale-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - run: python3 scripts/run_release_soak.py

  upstream-watchers:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - run: python3 scripts/check_wavelog_upstream.py --verify-pinned-paths
      - run: python3 scripts/check_sdroxide_upstream.py
      - run: python3 scripts/check_openhamclock_upstream.py
        continue-on-error: true
      - run: python3 scripts/check_nexus_upstream.py
        continue-on-error: true
      - run: python3 scripts/check_neural_dx_watcher_upstream.py
        continue-on-error: true
      - run: python3 scripts/check_qmx_panadapter_upstream.py
        continue-on-error: true
      - run: python3 scripts/check_rgo_one_upstream.py
        continue-on-error: true
      - run: python3 scripts/check_rotator_upstreams.py
        continue-on-error: true
